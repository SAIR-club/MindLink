name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets: a PR stacked on another PR's branch is checked too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout MindLink
        uses: actions/checkout@v4
        with:
          path: learner

      # The Episteme commit this build is pinned to (ADR 0013, step M1), not whatever main is today.
      - name: Read the pinned Episteme commit
        id: episteme
        run: echo "ref=$(cat learner/episteme.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout Episteme at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: SAIR-club/Episteme
          ref: ${{ steps.episteme.outputs.ref }}
          path: Episteme

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          standalone: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: learner/pnpm-lock.yaml

      - name: Build Episteme substrate
        working-directory: Episteme
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install learner dependencies
        working-directory: learner
        run: pnpm install --frozen-lockfile

      - name: Run learner verification
        working-directory: learner
        run: pnpm check
