name: PR Auto Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Parse Title and Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            // Match Conventional Commit title format: type(scope): message
            const match = title.match(/^([a-z]+)(?:\(([a-z0-9_-]+)\))?:/i);
            if (!match) return;

            const type = match[1].toLowerCase();
            const scope = match[2] ? match[2].toLowerCase() : null;

            const validTypes = new Set(['feat', 'fix', 'refactor', 'docs', 'test', 'chore']);
            const validScopes = new Set([
              'web',
              'blocks',
              'project',
              'platform',
              'cli',
              'host',
              'understanding'
            ]);

            const labelsToAdd = [];
            if (validTypes.has(type)) labelsToAdd.push(type);
            if (scope && validScopes.has(scope)) labelsToAdd.push(scope);

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labelsToAdd
              });
              console.log(`Added labels to PR #${context.payload.pull_request.number}:`, labelsToAdd);
            }
