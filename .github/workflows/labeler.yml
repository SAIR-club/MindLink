name: PR Auto Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Parse Title and Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;

            // Match Conventional Commit title format: type(scope)!: message or type!: message
            const match = title.match(/^([a-z]+)(?:\(([a-z0-9_/, -]+)\))?!?:/i);
            if (!match) return;

            const type = match[1].toLowerCase();
            const rawScope = match[2] ? match[2].toLowerCase() : '';

            const validTypes = new Set(['feat', 'fix', 'refactor', 'docs', 'test', 'chore', 'ci', 'build']);
            const validScopes = new Set([
              'web',
              'blocks',
              'project',
              'platform',
              'cli',
              'host',
              'understanding'
            ]);

            const currentLabels = (pr.labels || []).map(l => l.name);

            // Determine target type label
            const newTypeLabel = validTypes.has(type) ? type : null;

            // Determine target scope labels (supports comma or slash separated, e.g. web, project)
            const targetScopes = rawScope
              .split(/[,/ ]+/)
              .map(s => s.trim())
              .filter(s => validScopes.has(s));

            const labelsToAdd = [];
            if (newTypeLabel && !currentLabels.includes(newTypeLabel)) {
              labelsToAdd.push(newTypeLabel);
            }
            for (const s of targetScopes) {
              if (!currentLabels.includes(s)) {
                labelsToAdd.push(s);
              }
            }

            // Remove stale type labels if title type changed
            const labelsToRemove = [];
            for (const l of currentLabels) {
              if (validTypes.has(l) && newTypeLabel && l !== newTypeLabel) {
                labelsToRemove.push(l);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd
              });
              console.log(`Added labels to PR #${pr.number}:`, labelsToAdd);
            }

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
                console.log(`Removed stale label from PR #${pr.number}:`, label);
              } catch (e) {
                console.warn(`Could not remove label ${label}:`, e.message);
              }
            }
