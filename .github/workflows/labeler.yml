name: PR Auto Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Parse Title and Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;

            // Match Conventional Commit title: type(scope)!: message or type!: message
            const match = title.match(/^([a-z]+)(?:\(([a-z0-9_/, -]+)\))?!?:/i);
            if (!match) return;

            const type = match[1].toLowerCase();
            const rawScope = match[2] ? match[2].toLowerCase() : '';

            // Standard Conventional Commits types
            const COMMIT_TYPES = new Set([
              'feat', 'fix', 'refactor', 'perf', 'docs', 'test', 'build', 'ci', 'chore', 'revert', 'style'
            ]);

            // Dynamically query available repo labels to avoid maintaining hardcoded scope sets
            const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const availableLabels = new Set(repoLabels.map(l => l.name));
            const currentLabels = new Set((pr.labels || []).map(l => l.name));

            const labelsToAdd = [];

            // Match type
            if (COMMIT_TYPES.has(type) && availableLabels.has(type) && !currentLabels.has(type)) {
              labelsToAdd.push(type);
            }

            // Match scope(s) dynamically against available repository labels
            const scopes = rawScope.split(/[,/ ]+/).map(s => s.trim());
            for (const s of scopes) {
              if (s && availableLabels.has(s) && !currentLabels.has(s)) {
                labelsToAdd.push(s);
              }
            }

            // Remove stale type label if PR title type changed (e.g. from feat to fix)
            const labelsToRemove = [];
            for (const l of currentLabels) {
              if (COMMIT_TYPES.has(l) && COMMIT_TYPES.has(type) && l !== type) {
                labelsToRemove.push(l);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd,
              });
              console.log(`PR #${pr.number}: added labels:`, labelsToAdd);
            }

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                });
                console.log(`PR #${pr.number}: removed stale label:`, label);
              } catch (e) {
                console.warn(`Could not remove label ${label}:`, e.message);
              }
            }
