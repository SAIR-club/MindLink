packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests'

allowBuilds:
  better-sqlite3: false
  esbuild: true
  simple-git-hooks: true

overrides:
  '@episteme/agent': 'link:../Episteme/packages/agent'
  '@episteme/application': 'link:../Episteme/packages/application'
  '@episteme/core': 'link:../Episteme/packages/core'
  '@episteme/distillation': 'link:../Episteme/packages/distillation'
  '@episteme/embeddings-http': 'link:../Episteme/packages/embeddings-http'
  '@episteme/mcp': 'link:../Episteme/packages/mcp'
  '@episteme/service': 'link:../Episteme/apps/service'
  '@episteme/sdk': 'link:../Episteme/packages/sdk'
  '@episteme/storage-sqlite': 'link:../Episteme/packages/storage-sqlite'
  '@episteme/storage-memory': 'link:../Episteme/packages/storage-memory'
